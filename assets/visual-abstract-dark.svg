<text x="837.6" y="581.0" class="step-tool">genomic negatives</text>
<text x="837.6" y="594.0" class="small">MCC 0.729</text>
<text x="36.0" y="650.0" class="eyebrow">TAKE-HOME</text>
<text x="36.0" y="673.0" class="take">DeePromoter scores <tspan class="em">MCC 0.867</tspan> on its own benchmark, yet calls <tspan class="em">90% of random genomic DNA</tspan> a promoter.</text>
<text x="36.0" y="694.0" class="take">Retraining on real genomic negatives gives an honest MCC of 0.729, which shows why the choice of negatives matters.</text>
