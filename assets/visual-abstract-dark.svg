<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" width="1000" height="752" role="img" aria-labelledby="t d">
<title id="t">Visual abstract: Stress-testing a deep promoter predictor</title>
<desc id="d">DeePromoter, a multi-kernel CNN plus BiLSTM, reaches MCC 0.867 on its original human non-TATA benchmark of promoters versus modified promoters, yet labels 90 percent of random genomic sequences as promoters. Retrained with real genomic negatives (28,849 per class) it reaches MCC 0.729 and 87 percent test accuracy.</desc>
