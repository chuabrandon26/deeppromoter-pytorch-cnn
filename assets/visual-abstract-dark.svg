<text x="56.0" y="302.0" class="m-lab">filter activation along the sequence</text>
<path d="M131.3,226 L108.7,238" class="m-arrow"/>
<text x="184.0" y="342.0" class="small" text-anchor="middle">Convolution filters scan one-hot DNA for motifs</text>
<text x="52.0" y="368.0" class="body">Promoters switch genes on, and</text>
<text x="52.0" y="384.5" class="body">DeePromoter reports high accuracy at</text>
<text x="52.0" y="401.0" class="body">finding them. However, its negatives</text>
<text x="52.0" y="417.5" class="body">are modified promoters rather than</text>
<text x="52.0" y="434.0" class="body">real genomic DNA.</text>
<rect x="48" y="446" width="272" height="38" rx="8" class="qbox"/>
<circle cx="68" cy="465" r="10" class="qmark"/>
<text x="68.0" y="470.0" class="qmark-t" text-anchor="middle">?</text>
<text x="86.0" y="461.0" class="q">Does the model recognize promoters,</text>
<text x="86.0" y="477.0" class="q">or just unmodified sequence?</text>
<rect x="352" y="128" width="296" height="368" rx="12" class="panel"/><text x="368.0" y="154.0" class="eyebrow">DATA AND DESIGN</text><text x="368.0" y="176.0" class="h2">Human non-TATA promoters</text>
<rect x="368" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="222.0" class="num">25,920</text>
<text x="380.0" y="239.0" class="small">test promoters</text>
<rect x="504" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="222.0" class="num">28,849</text>
<text x="516.0" y="239.0" class="small">per class, new set</text>
<rect x="368" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="296.0" class="num">3</text>
<text x="380.0" y="313.0" class="small">CNN kernel sizes</text>
<rect x="504" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="296.0" class="num">BiLSTM</text>
<text x="516.0" y="313.0" class="small">sequence context</text>
<text x="368.0" y="362.0" class="body">Benchmark 1 pairs promoters with</text>
<text x="368.0" y="378.5" class="body">modified copies. Benchmark 2 pairs</text>
<text x="368.0" y="395.0" class="body">promoters with an equal number of</text>
<text x="368.0" y="411.5" class="body">random human genomic sequences.</text>
<line x1="368" y1="446" x2="632" y2="446" class="rule"/>
<text x="368.0" y="466.0" class="small">Kernels 27, 14 and 7; Adam, lr 1e-5</text>
<text x="368.0" y="481.0" class="small">Metric: Matthews correlation coefficient</text>
<rect x="668" y="128" width="296" height="368" rx="12" class="panel"/><text x="684.0" y="154.0" class="eyebrow">FINDINGS</text><text x="684.0" y="176.0" class="h2">Shortcut learning exposed</text>
<text x="684.0" y="212.0" class="lab">Original benchmark</text>
<text x="684.0" y="227.0" class="lab">MCC (validation)</text>
<rect x="848" y="192" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="216.0" class="tval" text-anchor="middle">0.867</text>
<text x="898.0" y="230.0" class="tsub" text-anchor="middle">precision 0.986</text>
<text x="684.0" y="264.0" class="lab">Random genomic DNA</text>
<text x="684.0" y="279.0" class="lab">called a promoter</text>
<rect x="848" y="244" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="268.0" class="tval" text-anchor="middle">90%</text>
<text x="898.0" y="282.0" class="tsub" text-anchor="middle">of 25,920</text>
<text x="684.0" y="316.0" class="lab">Retrained on genomic</text>
<text x="684.0" y="331.0" class="lab">negatives, MCC</text>
<rect x="848" y="296" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="320.0" class="tval" text-anchor="middle">0.729</text>
<text x="898.0" y="334.0" class="tsub" text-anchor="middle">precision 0.918</text>
<text x="684.0" y="368.0" class="lab">Retrained model</text>
<text x="684.0" y="383.0" class="lab">test accuracy</text>
<rect x="848" y="348" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="372.0" class="tval" text-anchor="middle">87%</text>
<text x="898.0" y="386.0" class="tsub" text-anchor="middle">balanced classes</text>
<text x="684.0" y="418.0" class="body">Promoters are GC-rich, yet not all of</text>
<text x="684.0" y="434.5" class="body">them are, so base composition alone</text>
<text x="684.0" y="451.0" class="body">is not enough.</text>
